appId: "fr.carru.elecwhat"

# https://sharp.pixelplumbing.com/install/#electron-builder
asar: true
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"

linux:
  # https://www.electron.build/app-builder-lib.interface.linuxconfiguration#target
  # AppImage, flatpak, snap, deb, rpm, freebsd, pacman, p5p, apk, 7z, zip, tar.xz, tar.lz, tar.gz, tar.bz2, dir.
  target:
    - AppImage
    - pacman
    - deb
    - snap
    - rpm
    - tar.xz

    # - flatpak
  category: "Network;Chat;InstantMessaging;X-WhatsApp;"
  desktop:
    entry:
      Name: ElecWhat
      GenericName: WhatsApp Client
      Comment: Simple WhatsApp client

  # Register "whatsapp:" url scheme
  mimeTypes:
    - x-scheme-handler/whatsapp

publish:
  - github

snapcraft:
  base: core24
  core24:
    title: ElecWhat
    description: |
      Simple Whatsapp client for linux
    # snapcraft CLI needs an isolated build env; multipass is installed in CI
    useMultipass: true
    publish:
      - github
      - snapStore
    slots:
      dbus-svc:
        interface: dbus
        bus: session
        name: "fr.carru.elecwhat"
    plugs:
      # The "gnome" extension (default on core24) already supplies:
      # desktop, desktop-legacy, gsettings, opengl, wayland, x11
      # and wires up the modern gnome-46-2404 / mesa-2404 content snaps.
      unity7:
      # alsa:
      # avahi-observe:
      browser-support:
      camera:
      # cups-control:
      home:
      network:
      audio-playback:
      # screen-inhibit-control:
      # upower-observe:

      # additional
      pulseaudio:
      audio-record:
