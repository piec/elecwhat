appId: "fr.carru.elecwhat"

# Without an explicit allowlist, electron-builder packs the whole project
# root into app.asar by default — including dotfiles like .vscode/ and
# .claude/, and any stray untracked files that happen to be sitting there
# (this is how a leftover dev-machine elecwhat.desktop and a whole
# usr/share/applications/ tree ended up shipped inside the app).
files:
  - src/**/*
  - src-web/**/*
  - static/**/*
  - locales/**/*
  - package.json

# https://sharp.pixelplumbing.com/install/#electron-builder
asar: true
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"

linux:
  # Electron uses desktopName (set in package.json) as its app_id/WM_CLASS;
  # this makes the generated .desktop file's basename match it too, so
  # desktop environments can associate running windows with the launcher
  # entry (taskbar/alt-tab/window-frame icon).
  # https://www.electron.build/linux#window-association-desktopname--syncdesktopname
  syncDesktopName: true
  # https://www.electron.build/app-builder-lib.interface.linuxconfiguration#target
  # AppImage, flatpak, snap, deb, rpm, freebsd, pacman, p5p, apk, 7z, zip, tar.xz, tar.lz, tar.gz, tar.bz2, dir.
  target:
    - AppImage
    - pacman
    - deb
    - snap
    - rpm
    - tar.xz

    # - flatpak
  category: "Network;Chat;InstantMessaging;X-WhatsApp;"
  desktop:
    entry:
      Name: ElecWhat
      GenericName: WhatsApp Client
      Comment: Simple WhatsApp client

  # Register "whatsapp:" url scheme
  mimeTypes:
    - x-scheme-handler/whatsapp

publish:
  - github

snapcraft:
  base: core24
  core24:
    title: ElecWhat
    description: |
      Simple Whatsapp client for linux
    # snapcraft CLI needs an isolated build env. LXD, not multipass: multipass's
    # build socket permissions don't take effect within a single CI job (group
    # membership is only refreshed on a fresh login) — a long-standing,
    # unresolved issue (https://github.com/canonical/multipass/issues/1075).
    # CI works around the same "needs a fresh login" problem for LXD's own
    # group by wrapping the build command in `sg lxd -c '...'` (see build.yml).
    useLXD: true
    publish:
      - github
      - snapStore
    slots:
      dbus-svc:
        interface: dbus
        bus: session
        name: "fr.carru.elecwhat"
    plugs:
      # The "gnome" extension (default on core24) already supplies:
      # desktop, desktop-legacy, gsettings, opengl, wayland, x11
      # and wires up the modern gnome-46-2404 / mesa-2404 content snaps.
      unity7:
      # alsa:
      # avahi-observe:
      browser-support:
      camera:
      # cups-control:
      home:
      network:
      audio-playback:
      # screen-inhibit-control:
      # upower-observe:

      # additional
      pulseaudio:
      audio-record:
