name: Build/release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    permissions:
      contents: write

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        os: [ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - run: sudo apt install -y libarchive-tools
      - run: sudo snap install snapcraft --classic

      # snapcraft needs an isolated build env; LXD, not multipass (multipass's
      # socket permissions don't take effect within a single CI job — see
      # electron-builder.yml). `sg lxd` below runs the build with the lxd
      # group active without needing a fresh login.
      - name: Set up LXD
        run: |
          sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto
          sudo usermod -a -G lxd "$USER"

          # GitHub Actions runners have Docker pre-installed, and Docker's
          # DOCKER-USER iptables chain drops forwarded traffic on *other*
          # bridges (like lxdbr0) by default — the LXD VM snapcraft launches
          # then has no network access to fetch/build anything.
          # https://documentation.ubuntu.com/lxd/en/latest/howto/network_bridge_firewalld/
          sudo iptables  -I DOCKER-USER -i lxdbr0 -j ACCEPT
          sudo ip6tables -I DOCKER-USER -i lxdbr0 -j ACCEPT
          sudo iptables  -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          sudo ip6tables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

      - run: npm ci

      - run: sg lxd -c "npx electron-builder --linux snap"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      - run: npx electron-builder --linux AppImage pacman deb rpm tar.xz
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Print SHA256 digests of built files
        run: find ./dist -maxdepth 1 -type f | sort | xargs sha256sum

      - env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
        run: |
          for f in ./dist/*.deb; do
            curl -s -X POST https://api.buildkite.com/v2/packages/organizations/piec/registries/elecwhat-deb/packages \
              -H "Authorization: Bearer $BUILDKITE_TOKEN" \
              -F "file=@$f"
          done

          for f in ./dist/*.rpm; do
            curl -s -X POST https://api.buildkite.com/v2/packages/organizations/piec/registries/elecwhat-rpm/packages \
              -H "Authorization: Bearer $BUILDKITE_TOKEN" \
              -F "file=@$f"
          done
