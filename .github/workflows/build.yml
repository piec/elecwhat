name: Build/release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    permissions:
      contents: write

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        os: [ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - run: sudo apt install -y libarchive-tools
      - run: sudo snap install snapcraft --classic

      # snapcraft needs an isolated build env; LXD, not multipass (multipass's
      # socket permissions don't take effect within a single CI job — see
      # electron-builder.yml). `sg lxd` below runs the build with the lxd
      # group active without needing a fresh login.
      - name: Set up LXD
        run: |
          sudo snap install lxd
          sudo lxd waitready
          sudo lxd init --auto
          sudo usermod -a -G lxd "$USER"

      - run: npm ci
      # dist
      - run: sg lxd -c "npm run release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      - name: Print SHA256 digests of built files
        run: find ./dist -maxdepth 1 -type f | sort | xargs sha256sum

      - env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
        run: |
          for f in ./dist/*.deb; do
            curl -s -X POST https://api.buildkite.com/v2/packages/organizations/piec/registries/elecwhat-deb/packages \
              -H "Authorization: Bearer $BUILDKITE_TOKEN" \
              -F "file=@$f"
          done

          for f in ./dist/*.rpm; do
            curl -s -X POST https://api.buildkite.com/v2/packages/organizations/piec/registries/elecwhat-rpm/packages \
              -H "Authorization: Bearer $BUILDKITE_TOKEN" \
              -F "file=@$f"
          done
