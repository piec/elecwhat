# Flatpak manifest, repackages electron-builder's linux output
# (dist/linux-unpacked). Built by build-flatpak.sh and in CI.
# The .desktop entry and metainfo are generated by build/flatpak-files.mjs
# (into dist/flatpak-files) from package.json and src/linux-desktop.json, like
# the other linux packages' entries.
app-id: fr.carru.elecwhat
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: elecwhat
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  # build/linux-wrapper.sh forces x11 in a flatpak (see there), wayland is kept
  # for --ozone-platform=wayland
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # camera for calls
  - --device=all
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  # tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # owning fr.carru.elecwhat on the session bus (src/dbus.mjs) is allowed by
  # default: it matches the app id

modules:
  - name: elecwhat
    buildsystem: simple
    build-commands:
      - cp -a elecwhat /app/elecwhat
      # zypak replaces the setuid sandbox helper
      - rm -f /app/elecwhat/chrome-sandbox
      - install -d /app/bin
      - ln -s /app/elecwhat/elecwhat /app/bin/elecwhat
      - install -Dm644 fr.carru.elecwhat.desktop /app/share/applications/fr.carru.elecwhat.desktop
      - install -Dm644 fr.carru.elecwhat.metainfo.xml /app/share/metainfo/fr.carru.elecwhat.metainfo.xml
      - install -Dm644 app-512.png /app/share/icons/hicolor/512x512/apps/fr.carru.elecwhat.png
    sources:
      - type: dir
        path: ../dist/linux-unpacked
        dest: elecwhat
      - type: file
        path: ../dist/flatpak-files/fr.carru.elecwhat.desktop
      - type: file
        path: ../dist/flatpak-files/fr.carru.elecwhat.metainfo.xml
      - type: file
        path: ../static/app-512.png
